<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">daak terminal profile with an ASCII giraffe</title>
  <desc id="description">A terminal-inspired GitHub profile header featuring Turkish copy and a standing giraffe drawn with text characters.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset=".56" stop-color="#0a1712"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <linearGradient id="terminalLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4ade80"/>
      <stop offset=".55" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glow" cx=".74" cy=".45" r=".48">
      <stop stop-color="#f59e0b" stop-opacity=".13"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#86efac" stroke-opacity=".035"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.05s steps(1, end) infinite; }
      .prompt { animation: prompt-glow 3.2s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes prompt-glow {
        0%, 100% { opacity: .78; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#4ade80" stroke-opacity=".24" stroke-width="2"/>

  <g transform="translate(30 25)">
    <circle cx="10" cy="10" r="6" fill="#fb7185"/>
    <circle cx="32" cy="10" r="6" fill="#facc15"/>
    <circle cx="54" cy="10" r="6" fill="#4ade80"/>
    <text x="84" y="16" class="mono" fill="#6b8f79" font-size="16">daak.profile — zsh — 120x42</text>
  </g>
  <path d="M0 69H1200" stroke="#4ade80" stroke-opacity=".15"/>

  <g class="mono" transform="translate(58 106)">
    <text class="prompt" x="0" y="0" fill="#4ade80" font-size="20" font-weight="700">daak@github:~$</text>
    <text x="216" y="0" fill="#d1fae5" font-size="20">whoami</text>

    <text x="0" y="65" fill="url(#terminalLine)" font-size="70" font-weight="800" letter-spacing="-4" filter="url(#softGlow)">daak</text>
    <text x="2" y="105" fill="#fef3c7" font-size="23" font-weight="700">naber gardaş</text>
    <text x="2" y="143" fill="#d1d5db" font-size="18">uygulamaları kendim için yapıyom</text>
    <text x="2" y="170" fill="#d1d5db" font-size="18">işine yarayan olursa alabilirsin</text>

    <text x="0" y="224" fill="#4ade80" font-size="18">›</text>
    <text x="28" y="224" fill="#9ca3af" font-size="18">macOS · local-first · open source</text>
    <text x="0" y="260" fill="#4ade80" font-size="18">›</text>
    <text x="28" y="260" fill="#9ca3af" font-size="18">Swift · Python · PowerShell</text>
    <rect class="cursor" x="0" y="284" width="13" height="24" rx="2" fill="#4ade80"/>
  </g>

  <g transform="translate(785 58)">
    <text x="0" y="0" class="mono" fill="#6b8f79" font-size="15">/* ascii_giraffe.txt */</text>
    <text class="mono" fill="#f6c453" font-size="17" font-weight="700" xml:space="preserve" filter="url(#softGlow)">
      <tspan x="0" y="31">                    .-.</tspan>
      <tspan x="0" dy="16.5">                   /  _\</tspan>
      <tspan x="0" dy="16.5">                  |  / 6</tspan>
      <tspan x="0" dy="16.5">                  |  \_/</tspan>
      <tspan x="0" dy="16.5">             .----'   |</tspan>
      <tspan x="0" dy="16.5">            /  .-.    |</tspan>
      <tspan x="0" dy="16.5">           /  /## \   |</tspan>
      <tspan x="0" dy="16.5">          |  | ## |   |</tspan>
      <tspan x="0" dy="16.5">          |   \__/    |</tspan>
      <tspan x="0" dy="16.5">           \          /</tspan>
      <tspan x="0" dy="16.5">            '---. .--'</tspan>
      <tspan x="0" dy="16.5">                | |</tspan>
      <tspan x="0" dy="16.5">          ______| |______</tspan>
      <tspan x="0" dy="16.5">         / ##  ##  ##   \</tspan>
      <tspan x="0" dy="16.5">        |  ##     ##     |</tspan>
      <tspan x="0" dy="16.5">         \_____  _______/</tspan>
      <tspan x="0" dy="16.5">               | |</tspan>
      <tspan x="0" dy="16.5">              /| |\</tspan>
      <tspan x="0" dy="16.5">             /_| |_\</tspan>
    </text>
  </g>
</svg>
