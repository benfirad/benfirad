<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">daak — useful tools that stay out of the way</title>
  <desc id="desc">Animated dark banner with glowing gradient shapes and rotating descriptions of daak's open-source work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".52" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#070a18"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .orb-one { animation: drift-one 9s ease-in-out infinite alternate; }
      .orb-two { animation: drift-two 11s ease-in-out infinite alternate; }
      .spark { animation: twinkle 3.2s ease-in-out infinite; }
      .spark:nth-of-type(2n) { animation-delay: -1.1s; }
      .spark:nth-of-type(3n) { animation-delay: -2.2s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .line-one { animation: line-one 12s ease-in-out infinite; }
      .line-two { animation: line-two 12s ease-in-out infinite; opacity: 0; }
      .line-three { animation: line-three 12s ease-in-out infinite; opacity: 0; }
      @keyframes drift-one {
        to { transform: translate(85px, 22px) scale(1.08); }
      }
      @keyframes drift-two {
        to { transform: translate(-65px, -18px) scale(.93); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: .18; }
        50% { opacity: .9; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .45; transform: scale(.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes line-one {
        0%, 25% { opacity: 1; transform: translateY(0); }
        31%, 94% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes line-two {
        0%, 28% { opacity: 0; transform: translateY(8px); }
        34%, 58% { opacity: 1; transform: translateY(0); }
        64%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes line-three {
        0%, 61% { opacity: 0; transform: translateY(8px); }
        67%, 91% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .line-one { opacity: 1; }
        .line-two, .line-three { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#background)"/>
  <rect width="1200" height="330" rx="28" fill="url(#grid)"/>
  <circle class="orb-one" cx="135" cy="65" r="220" fill="url(#cyanGlow)"/>
  <circle class="orb-two" cx="1080" cy="260" r="260" fill="url(#violetGlow)"/>

  <g fill="#e2e8f0">
    <circle class="spark" cx="88" cy="247" r="2"/>
    <circle class="spark" cx="192" cy="82" r="1.8"/>
    <circle class="spark" cx="322" cy="278" r="1.5"/>
    <circle class="spark" cx="872" cy="62" r="1.8"/>
    <circle class="spark" cx="1048" cy="105" r="1.5"/>
    <circle class="spark" cx="1122" cy="244" r="2"/>
    <circle class="spark" cx="760" cy="285" r="1.4"/>
  </g>

  <g transform="translate(92 74)">
    <rect width="16" height="16" rx="4" fill="#22d3ee" class="pulse"/>
    <text x="29" y="13" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600" letter-spacing="2.8">@BENFIRAD / OPEN SOURCE</text>
  </g>

  <text x="88" y="190" fill="url(#brand)" filter="url(#softGlow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="104" font-weight="800" letter-spacing="-5">daak</text>

  <g fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="500">
    <text class="line-one" x="92" y="247">macOS utilities that stay out of your way.</text>
    <text class="line-two" x="92" y="247">privacy-first tools, built in the open.</text>
    <text class="line-three" x="92" y="247">Swift · Python · PowerShell · useful experiments.</text>
  </g>

  <g transform="translate(930 89)" fill="none" stroke-linecap="round">
    <circle cx="74" cy="74" r="72" stroke="#64748b" stroke-opacity=".58" stroke-width="2"/>
    <circle cx="74" cy="74" r="50" stroke="#a78bfa" stroke-opacity=".85" stroke-width="2" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0 74 74" to="360 74 74" dur="18s" repeatCount="indefinite"/>
    </circle>
    <path d="M39 80l22 22 51-58" stroke="#22d3ee" stroke-width="10" filter="url(#softGlow)"/>
    <circle cx="74" cy="74" r="6" fill="#22d3ee" stroke="none" class="pulse"/>
  </g>

  <rect x="1" y="1" width="1198" height="328" rx="27" fill="none" stroke="url(#brand)" stroke-opacity=".28" stroke-width="2"/>
</svg>
